services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: nfc_platform
      POSTGRES_USER: nfc
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nfc -d nfc_platform"]
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build: .
    restart: unless-stopped
    ports: ["3000:3000"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://nfc:${POSTGRES_PASSWORD}@db:5432/nfc_platform?schema=public
      DATABASE_EXPECTED_NAME: nfc_platform
      APP_URL: ${APP_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ACTIVATION_PEPPER: ${ACTIVATION_PEPPER:?Set ACTIVATION_PEPPER}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      STORAGE_PROVIDER: local
      STORAGE_ENVIRONMENT: development
      EMAIL_MODE: mock
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      EMAIL_WEBHOOK_URL: ${EMAIL_WEBHOOK_URL:-}
      EMAIL_WEBHOOK_SECRET: ${EMAIL_WEBHOOK_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_CLIENT_SECRET: ${APPLE_CLIENT_SECRET:-}
      UPLOAD_DIR: /app/data/uploads
    volumes:
      - product_uploads:/app/data/uploads
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: postgresql://nfc:${POSTGRES_PASSWORD}@db:5432/nfc_platform?schema=public
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  seed:
    profiles: ["tools"]
    build:
      context: .
      target: migrator
    command: ["npm", "run", "db:seed"]
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql://nfc:${POSTGRES_PASSWORD}@db:5432/nfc_platform?schema=public
      DATABASE_EXPECTED_NAME: nfc_platform
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET}
      ACTIVATION_PEPPER: ${ACTIVATION_PEPPER:?Set ACTIVATION_PEPPER}
      STORAGE_PROVIDER: local
      STORAGE_ENVIRONMENT: development
      EMAIL_MODE: mock
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL:-}
      DEV_ADMIN_PASSWORD: ${DEV_ADMIN_PASSWORD:-}
    depends_on:
      migrate: { condition: service_completed_successfully }
volumes:
  postgres_data:
  product_uploads:
