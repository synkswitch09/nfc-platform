name: Deploy STAGING
on:
  push:
    branches: [staging]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  validate:
    uses: ./.github/workflows/_validate.yml
  publish_images:
    # Bootstrap GHCR before the first Azure rollout, while deployment stays disabled.
    if: ${{ true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: migrator
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}-migrator
  deploy:
    needs: validate
    if: ${{ false }}
    uses: ./.github/workflows/_deploy-azure.yml
    with: { target_environment: staging }
    secrets: inherit
