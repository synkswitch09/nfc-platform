name: Consolidate staging PostgreSQL into production server
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only audit before migrating staging
        type: choice
        options: [audit]
        required: true
        default: audit
permissions:
  contents: read
  id-token: write
concurrency:
  group: database-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v5
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Audit database connections and private network without exposing secrets
        run: python3 scripts/consolidate-staging-database.py
        env:
          CONSOLIDATION_OPERATION: ${{ inputs.operation }}
