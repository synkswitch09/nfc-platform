name: Consolidate staging PostgreSQL into production server
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Audit, migrate and retire staging, or finish verified retirement
        type: choice
        options: [audit, migrate, retire]
        required: true
        default: audit
permissions:
  contents: read
  id-token: write
  packages: write
concurrency:
  group: database-consolidation
  cancel-in-progress: false
jobs:
  consolidate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: production
    env:
      CONSOLIDATION_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-db-consolidation
      CONSOLIDATION_OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v5
      - name: Verify migration controls
        run: python3 -m unittest discover -s tests -p 'test_database_consolidation.py'
      - uses: docker/login-action@v3
        if: inputs.operation == 'migrate'
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - uses: docker/build-push-action@v6
        if: inputs.operation == 'migrate'
        with:
          context: .
          file: ops/database-consolidation/Dockerfile
          push: true
          tags: ${{ env.CONSOLIDATION_IMAGE }}
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Consolidate with verified backup, private networking and rollback
        run: python3 -u scripts/database-consolidation-run.py
