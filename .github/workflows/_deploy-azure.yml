name: Reusable Azure deployment
on:
  workflow_call:
    inputs:
      target_environment:
        required: true
        type: string
concurrency:
  group: deploy-${{ inputs.target_environment }}
  cancel-in-progress: ${{ inputs.target_environment != 'production' }}
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ inputs.target_environment }}
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
      MIGRATION_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-migrator
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/build-push-action@v6
        with: { context: ., target: runner, push: true, tags: "${{ env.IMAGE }}" }
      - uses: docker/build-push-action@v6
        with: { context: ., target: migrator, push: true, tags: "${{ env.MIGRATION_IMAGE }}" }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Prepare definitive provider credentials and CMS verification
        if: inputs.target_environment == 'staging' || inputs.target_environment == 'production'
        run: python3 scripts/maintain-azure-env.py
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          APPLY_CHANGES: "true"
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Run the environment migration job once
        run: |
          az containerapp job update --name "$AZURE_MIGRATION_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --image "$MIGRATION_IMAGE" --remove-env-vars EMAIL_FROM_ADDRESS EMAIL_FROM_ADDRESS_KOSYKIN
          execution_name=$(az containerapp job start --name "$AZURE_MIGRATION_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --query name --output tsv)
          test -n "$execution_name"
          echo "Waiting for migration execution: $execution_name"
          for attempt in {1..90}; do
            status=$(az containerapp job execution show --name "$AZURE_MIGRATION_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution_name" --query properties.status --output tsv)
            case "$status" in
              Succeeded) echo "Migration succeeded"; exit 0 ;;
              Failed|Canceled|Cancelled) echo "Migration ended with status: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Timed out waiting for migration execution: $execution_name"
          exit 1
        env:
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      - name: Deploy immutable application image
        run: az containerapp update --name "$AZURE_CONTAINER_APP" --resource-group "$AZURE_RESOURCE_GROUP" --image "$IMAGE" --remove-env-vars EMAIL_FROM_ADDRESS EMAIL_FROM_ADDRESS_KOSYKIN
        env:
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      - name: Remove retired configuration after compatible deployment
        if: inputs.target_environment == 'staging' || inputs.target_environment == 'production'
        run: python3 scripts/maintain-azure-env.py
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          APPLY_CHANGES: "true"
          ALLOW_LEGACY_REMOVAL: "true"
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Verify obsolete sender variables were removed
        run: |
          python3 - <<'PYCODE'
          import json, os, subprocess
          obsolete = {"EMAIL_FROM_ADDRESS", "EMAIL_FROM_ADDRESS_KOSYKIN"}
          for resource, name in [("containerapp", os.environ["AZURE_CONTAINER_APP"]), ("containerapp job", os.environ["AZURE_MIGRATION_JOB"])]:
              data = json.loads(subprocess.check_output(["az", *resource.split(), "show", "--name", name, "--resource-group", os.environ["AZURE_RESOURCE_GROUP"], "--output", "json"]))
              names = {entry["name"] for container in data["properties"]["template"]["containers"] for entry in container.get("env", [])}
              if names & obsolete:
                  raise RuntimeError("Obsolete sender variables remain on " + resource)
          print("Verified: application and migration job have no obsolete sender variables")
          PYCODE
        env:
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      - uses: actions/setup-node@v5
        with: { node-version: 24 }
      - name: Ensure recurring environment order worker
        if: inputs.target_environment == 'staging' || inputs.target_environment == 'production'
        run: python3 scripts/ensure-order-worker.py
        env:
          TARGET_ENVIRONMENT: ${{ inputs.target_environment }}
          AZURE_CONTAINER_APP: ${{ vars.AZURE_CONTAINER_APP }}
          AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
          APP_URL: ${{ vars.APP_URL }}
      - name: Run post-deployment smoke tests
        run: npm run smoke
        env:
          SMOKE_BASE_URL: ${{ vars.APP_URL }}
          SMOKE_PRODUCT_SLUG: ${{ vars.SMOKE_PRODUCT_SLUG }}
          SMOKE_TAG_ID: ${{ vars.SMOKE_TAG_ID }}
