name: Reusable validation
on:
  workflow_call:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: nfc_platform, POSTGRES_USER: nfc, POSTGRES_PASSWORD: nfc }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nfc -d nfc_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: development
      DATABASE_URL: postgresql://nfc:nfc@localhost:5432/nfc_platform?schema=public
      DATABASE_EXPECTED_NAME: nfc_platform
      APP_URL: http://127.0.0.1:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ACTIVATION_PEPPER: ci-activation-pepper-with-at-least-32-characters
      STORAGE_PROVIDER: local
      STORAGE_ENVIRONMENT: development
      EMAIL_MODE: mock
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - name: Block critical dependency advisories
        run: npm audit --omit=dev --audit-level=critical
      - run: npm run config:check
      - run: npm run db:deploy
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build production runtime image
        run: docker build --target runner --tag tapkin:${{ github.sha }} .
      - name: Build controlled migration image
        run: docker build --target migrator --tag tapkin-migrator:${{ github.sha }} .
      - name: Seed disposable E2E database
        run: npm run db:seed
        env:
          DEV_ADMIN_EMAIL: e2e-admin@example.test
          DEV_ADMIN_PASSWORD: E2eAdminPassword123
      - name: Run required HTTP E2E flows
        env:
          ENABLE_TEST_CHECKOUT: "true"
          E2E_ADMIN_EMAIL: e2e-admin@example.test
          E2E_ADMIN_PASSWORD: E2eAdminPassword123
          E2E_BASE_URL: http://127.0.0.1:3000
          E2E_APP_LOG: /tmp/nfc-e2e-app.log
          EMAIL_TEST_OUTBOX_PATH: /tmp/nfc-e2e-email-outbox.ndjson
          E2E_EMAIL_OUTBOX: /tmp/nfc-e2e-email-outbox.ndjson
          STRIPE_SECRET_KEY: e2e-not-a-real-stripe-key
          STRIPE_WEBHOOK_SECRET: e2e-webhook-secret
          E2E_STRIPE_WEBHOOK_SECRET: e2e-webhook-secret
        run: |
          rm -f /tmp/nfc-e2e-email-outbox.ndjson
          npm run dev -- --hostname 127.0.0.1 > /tmp/nfc-e2e-app.log 2>&1 &
          APP_PID=$!
          trap 'kill "$APP_PID" 2>/dev/null || true' EXIT
          if ! npm run test:e2e; then
            echo "::group::Application log (last 200 lines)"
            tail -n 200 /tmp/nfc-e2e-app.log || true
            echo "::endgroup::"
            exit 1
          fi
