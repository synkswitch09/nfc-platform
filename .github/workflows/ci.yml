name: CI
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: nfc_platform, POSTGRES_USER: nfc, POSTGRES_PASSWORD: nfc }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nfc -d nfc_platform"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://nfc:nfc@localhost:5432/nfc_platform?schema=public
      APP_URL: http://localhost:3000
      SESSION_SECRET: ci-session-secret-with-at-least-32-characters
      ACTIVATION_PEPPER: ci-activation-pepper-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
