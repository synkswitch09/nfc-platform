name: One-time staging administrator bootstrap
on:
  push:
    branches: [staging]
permissions:
  contents: read
  packages: write
  id-token: write
jobs:
  bootstrap:
    if: vars.STAGING_BOOTSTRAP_ADMIN_EMAIL != ''
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: one-time-staging-admin
      cancel-in-progress: false
    env:
      IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}-bootstrap
      ADMIN_EMAIL: ${{ vars.STAGING_BOOTSTRAP_ADMIN_EMAIL }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_MIGRATION_JOB: ${{ vars.AZURE_MIGRATION_JOB }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with: { context: ., target: migrator, push: true, tags: "${{ env.IMAGE }}" }
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Grant first verified staging account administrator access
        shell: bash
        run: |
          execution_name=$(az containerapp job start --name "$AZURE_MIGRATION_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --image "$IMAGE" --command node --args prisma/bootstrap-staging-admin.mjs --env-vars "DATABASE_URL=secretref:database-url" "APP_ENV=staging" "STAGING_BOOTSTRAP_EMAIL=$ADMIN_EMAIL" --query name --output tsv)
          test -n "$execution_name"
          echo "Waiting for one-time administrator job: $execution_name"
          for attempt in {1..60}; do
            status=$(az containerapp job execution show --name "$AZURE_MIGRATION_JOB" --resource-group "$AZURE_RESOURCE_GROUP" --job-execution-name "$execution_name" --query properties.status --output tsv)
            case "$status" in
              Succeeded) echo "Administrator bootstrap succeeded"; exit 0 ;;
              Failed|Canceled|Cancelled) echo "Administrator bootstrap failed: $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "Administrator bootstrap timed out"
          exit 1
